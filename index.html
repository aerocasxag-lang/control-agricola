<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13251B">
<title>Control Agrícola · AeroCAS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- INICIO DE SESIÓN -->
<section id="login" class="login" hidden>
  <form id="fLogin" class="login-card" autocomplete="on">
    <div class="brand"><span class="brand-mark">AeroCAS</span><h1>Control Agrícola</h1></div>
    <label for="lEmail">Correo<input id="lEmail" type="email" autocomplete="username" required></label>
    <label for="lPass">Contraseña<input id="lPass" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Entrar</button>
    <p class="msg" id="lMsg" role="status"></p>
    <p class="hint">La primera vez necesitas señal. Después la app abre sin internet.</p>
  </form>
</section>

<!-- APP -->
<div id="app" hidden>
  <div id="net" class="net" role="status"></div>

  <!-- MAPA (INICIO) -->
  <section id="v-mapa" class="view view-map">
    <div id="map"></div>
    <div class="map-top">
      <button class="fab" id="bMenuLotes" aria-label="Lista de lotes"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
      <button class="finca-sel" id="bFinca" aria-label="Elegir finca"><span id="fincaNombre">Todas las fincas</span> ▾</button>
    </div>
    <div class="map-tools">
      <button class="fab" id="bNuevo" aria-label="Registrar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="fab" id="bAlertas" aria-label="Alertas"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="alertBadge" hidden></span></button>
      <button class="fab" id="bCapas" aria-label="Cambiar fondo del mapa"><svg viewBox="0 0 24 24"><path d="M12 4l9 5-9 5-9-5z"/><path d="M3 14l9 5 9-5"/></svg></button>
      <button class="fab" id="bGps" aria-label="Mi ubicación"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" class="fill"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button class="fab" id="bMedir" aria-label="Medir"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx="1.5" transform="rotate(-35 12 12)"/><path d="M8 10.5l1.2 1.7M11 8.4l1.2 1.7M14 6.3l1.2 1.7"/></svg></button>
    </div>
    <div class="measure" id="measure" hidden><span id="measureTxt">Toca el mapa para medir</span><button class="btn small" id="bMedirFin">Terminar</button></div>
    <div class="map-bottom" id="mapBottom">
      <button class="btn ghost-map" id="bLista">Lista de lotes</button>
      <button class="btn primary" id="bRegistrar">+ Registrar</button>
    </div>
    <!-- Ficha del lote -->
    <div class="sheet" id="ficha" hidden>
      <div class="handle"></div>
      <div class="ficha-head">
        <div class="ficha-ico"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v16M12 12h8"/></svg></div>
        <div class="ficha-tit">
          <h2 id="fNombre"></h2>
          <p id="fSub"></p>
          <button class="link" id="fMasBtn">Más detalles ▾</button>
        </div>
        <button class="close" id="fCerrar" aria-label="Cerrar">×</button>
      </div>
      <dl class="ficha-mas" id="fMas" hidden></dl>
      <div class="acts">
        <button class="act main" id="fRegistrar">Registrar</button>
        <button class="act" id="fEditar">Editar</button>
        <button class="act" id="fCompartir">Compartir</button>
        <button class="act" id="fMasAcc">Más</button>
      </div>
      <button class="row-link" id="fNotas"><span>Etiquetas y notas</span><span>›</span></button>
      <div class="seg" role="tablist">
        <button role="tab" aria-selected="true" data-seg="reg">Registros</button>
        <button role="tab" aria-selected="false" data-seg="vue">Vuelos</button>
        <button role="tab" aria-selected="false" data-seg="vig">Mapa de vigor</button>
      </div>
      <div id="fSegBody" class="seg-body"></div>
    </div>
  </section>

  <!-- REGISTROS -->
  <section id="v-registros" class="view page" hidden>
    <header class="page-head"><h2>Registros</h2></header>
    <div class="chips" id="regFiltros"></div>
    <div class="list" id="regLista"></div>
  </section>

  <!-- PANEL -->
  <section id="v-panel" class="view page" hidden>
    <header class="page-head"><h2>Panel</h2>
      <div class="filtros-panel"><select id="panelLote" aria-label="Filtrar por lote"></select><select id="panelCiclo" aria-label="Filtrar por ciclo"></select></div>
    </header>
    <div class="kpis" id="kpis"></div>
    <div id="panelExtra"></div>
  </section>

  <!-- GASTOS -->
  <section id="v-gastos" class="view page" hidden>
    <header class="page-head"><h2>Gastos</h2></header>
    <div id="gastosBody" style="display:grid;gap:14px"></div>
  </section>

  <!-- YO -->
  <section id="v-yo" class="view page" hidden>
    <header class="page-head"><h2>Yo</h2></header>
    <div class="card" id="yoCard"></div>
    <div id="yoAdmin"></div>
    <button class="btn" id="bSalir">Cerrar sesión</button>
    <p class="hint center" id="version"></p>
  </section>

  <nav class="tabbar" id="tabbar">
    <button data-v="mapa" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="18" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>Inicio</button>
    <button data-v="registros" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M8 12h8M8 16h5"/></svg>Registros<span class="badge" id="regBadge" hidden></span></button>
    <button data-v="gastos" aria-selected="false" id="tabGastos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M7 9v.01M17 15v.01"/></svg>Gastos</button>
    <button data-v="panel" aria-selected="false" id="tabPanel"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Panel</button>
    <button data-v="yo" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>Yo</button>
  </nav>

  <!-- MODAL GENÉRICO -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mTitulo">
      <header><h2 id="mTitulo"></h2><button class="close" id="mCerrar" aria-label="Cerrar">×</button></header>
      <div id="mBody" class="modal-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<div id="cargando" class="cargando">Cargando…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script src="dibujo.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
